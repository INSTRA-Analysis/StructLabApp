<?xml version="1.0" encoding="UTF-8"?>
<!-- instrahub mark (concept D, "hub and modules"): one engine at the centre, five modules
     around it. Colours for the dark interface; the light-ground variant swaps #e1e6ee for #0f2a3d.
     Copyright (c) 2024-2026 Imed Mhamdi / INSTRA Analysis. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8bfd"/>
      <stop offset="0.55" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#e1e6ee" stroke-opacity="0.35" stroke-width="1.6"/>
  <g stroke="#e1e6ee" stroke-width="2.8" stroke-linecap="round">
    <line x1="32" y1="22" x2="32" y2="10"/>
    <line x1="41.5" y1="28.9" x2="52.9" y2="25.2"/>
    <line x1="37.9" y1="40.1" x2="44.9" y2="49.8"/>
    <line x1="26.1" y1="40.1" x2="19.1" y2="49.8"/>
    <line x1="22.5" y1="28.9" x2="11.1" y2="25.2"/>
  </g>
  <circle cx="32" cy="10" r="5.6" fill="#3d8bfd"/>
  <circle cx="52.9" cy="25.2" r="5.6" fill="#4fb3f6"/>
  <circle cx="44.9" cy="49.8" r="5.6" fill="#00b4d8"/>
  <circle cx="19.1" cy="49.8" r="5.6" fill="#4fd1c5"/>
  <circle cx="11.1" cy="25.2" r="5.6" fill="#e1e6ee"/>
  <circle cx="32" cy="32" r="10" fill="url(#hub)"/>
</svg>
